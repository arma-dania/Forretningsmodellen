[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Øvelsen og admin-modulet er statiske sider uden byggetrin.
# API'et ligger i netlify/functions og rammes på /api/* og /admin-api/*.
#
# Siden ligger i public/ og ikke i rodmappen med vilje: alt under publish
# lægges ud som statiske filer, og netlify/functions/_facit.mjs indeholder
# svarene på øvelsen. De to mapper skal holdes adskilt.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "same-origin"
